name: Feature request
description: Suggest a new JustVoxel feature or improvement.
title: "[Feature]: "
body:
  - type: checkboxes
    id: existing-issues
    attributes:
      label: Existing issues
      options:
        - label: I searched the existing issues in this repository for this idea.
          required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Minecraft
        - System
        - Installation
        - Other
    validations:
      required: true
  - type: textarea
    id: problem-to-solve
    attributes:
      label: What problem would this solve?
      description: Describe what you are trying to do and what makes it difficult today, rather than only naming a technology.
    validations:
      required: true
  - type: textarea
    id: requested-behavior
    attributes:
      label: What would you like JustVoxel to do?
      description: Describe the feature or improvement you would like.
    validations:
      required: true
  - type: textarea
    id: user-workflow
    attributes:
      label: Describe the normal user workflow
      description: Explain what a normal person should click or do, and what result they should get.
    validations:
      required: true
  - type: textarea
    id: anything-else
    attributes:
      label: Anything else?
      description: You can include screenshots, mockups, or examples here.
    validations:
      required: false
