name: A4.4.6 integration check

on:
  push:
    branches: [a441-setup-plan-helper-work]

permissions:
  contents: read

jobs:
  source-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00
        with:
          go-version: '1.25.x'
          check-latest: true
          cache: false
      - name: Install management test dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libpam0g-dev libpwquality-dev
      - name: Validate A4.4 Go formatting and all shell syntax
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(gofmt -l \
            management/cmd/justvoxel-management-agent/admin_discovery.go \
            management/cmd/justvoxel-management-agent/admin_setup_plan.go \
            management/cmd/justvoxel-management-agent/admin_setup_plan_test.go)"
          for script in \
            build_files/*.sh \
            build_files/validate/*.sh \
            mjust/bin/mjust \
            mjust/libexec/* \
            runtime/* \
            tests/*.sh; do
            [[ -f "${script}" ]] || continue
            bash -n "${script}"
          done
      - name: Run all shell regression tests
        shell: bash
        run: |
          set -euo pipefail
          for test_script in tests/test-*.sh; do
            [[ -f "${test_script}" ]] || continue
            bash "${test_script}"
          done
      - name: Vet test build and smoke management agent
        shell: bash
        run: |
          set -euo pipefail
          cd management
          go mod download
          CGO_ENABLED=1 go vet ./...
          CGO_ENABLED=1 go test ./...
          CGO_ENABLED=1 go build -trimpath -o /tmp/management-agent ./cmd/justvoxel-management-agent
          /tmp/management-agent version
