name: A4.4.2 setup planning API check

on:
  push:
    branches: [a441-setup-plan-helper-work]

permissions:
  contents: read

jobs:
  source-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00
        with:
          go-version: '1.25.x'
          check-latest: true
          cache: false

      - name: Install management test dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libpam0g-dev libpwquality-dev

      - name: Validate source formatting and shell syntax
        shell: bash
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l \
            management/cmd/justvoxel-management-agent/admin_discovery.go \
            management/cmd/justvoxel-management-agent/admin_setup_plan.go \
            management/cmd/justvoxel-management-agent/admin_setup_plan_test.go)"
          if [[ -n "${unformatted}" ]]; then
            printf 'A4.4.2 Go files require gofmt:\n%s\n' "${unformatted}" >&2
            exit 1
          fi
          for script in \
            build_files/*.sh \
            build_files/validate/*.sh \
            mjust/bin/mjust \
            mjust/libexec/* \
            runtime/* \
            tests/*.sh; do
            [[ -f "${script}" ]] || continue
            bash -n "${script}"
          done

      - name: Run shell regression tests
        shell: bash
        run: |
          set -euo pipefail
          for test_script in tests/test-*.sh; do
            [[ -f "${test_script}" ]] || continue
            bash "${test_script}"
          done

      - name: Run management tests
        shell: bash
        run: |
          set -euo pipefail
          cd management
          go mod download
          CGO_ENABLED=1 go vet ./...
          CGO_ENABLED=1 go test ./...
