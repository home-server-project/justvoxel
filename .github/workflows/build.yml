name: Stable products
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * 6'

concurrency:
  group: stable-products
  cancel-in-progress: false

env:
  VM_IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/justvoxel-vm
  HWS_IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/justvoxel-hws
  CURRENT_TAG: stable
  PARENT_CHANNEL: local
  PRODUCT_STATUS: stable
  JUSTVOXEL_DEV_IMAGE: localhost/justvoxel-dev:build
  IMAGE_REPOSITORY: ghcr.io/home-server-project/justvoxel-dev
  HOME_SERVER_BASE_IMAGE: ghcr.io/home-server-project/home-server-base-10:stable
  RECHUNK_MAX_LAYERS: '127'
  OCI_LAYER_LIMIT: '128'

jobs:
  source-tests:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    uses: ./.github/workflows/source-checks.yml

  build:
    needs: source-tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go for local WebUI build
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: ".go-version"
          cache: false

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y podman skopeo jq

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.3'

      - name: Verify Home Server Base stable signature
        shell: bash
        run: |
          set -euo pipefail
          cosign verify \
            --new-bundle-format=false \
            --key cosign.pub \
            "${HOME_SERVER_BASE_IMAGE}" >/dev/null

      - name: Build Management Agent from source
        uses: ./.github/actions/build-management

      - name: Build and validate common image
        uses: ./.github/actions/build-dev

      - name: Build both product images
        uses: ./.github/actions/build-products

      - name: Login to GHCR
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.docker"
          printf '%s' "${GHCR_TOKEN}" | podman login \
            --authfile "${HOME}/.docker/config.json" \
            ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
          chmod 600 "${HOME}/.docker/config.json"

      - name: Publish both products
        uses: ./.github/actions/publish-products
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
