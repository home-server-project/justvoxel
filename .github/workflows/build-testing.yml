name: Development
on:
  pull_request:
    branches: [testing]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: development-testing-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/justvoxel-dev
  CURRENT_TAG: 'testing'
  RECHUNK_MAX_LAYERS: '127'
  OCI_LAYER_LIMIT: '128'
  HOME_SERVER_BASE_IMAGE: ghcr.io/home-server-project/home-server-base-10:stable
  MANAGEMENT_PACKAGE: ghcr.io/home-server-project/justvoxel-management-agent:testing

jobs:
  source-tests:
    permissions:
      contents: read
    uses: ./.github/workflows/source-checks.yml

  validate-image:
    if: github.event_name == 'pull_request'
    needs: source-tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go for local WebUI build
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: ".go-version"
          cache: false

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y podman skopeo jq

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.3'

      - name: Verify Home Server Base stable signature
        shell: bash
        run: |
          set -euo pipefail
          cosign verify \
            --new-bundle-format=false \
            --key cosign.pub \
            "${HOME_SERVER_BASE_IMAGE}" >/dev/null

      - name: Build Management Agent from source
        uses: ./.github/actions/build-management
        with:
          mode: development

      - name: Build and validate Development
        uses: ./.github/actions/build-dev

  build:
    concurrency: management-package-testing
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/testing'
    name: Build JustVoxel development image testing
    needs: [source-tests]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go for local WebUI build
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: ".go-version"
          cache: false

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y podman skopeo jq

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.3'

      - name: Login to GHCR
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.docker"
          printf '%s' "${GHCR_TOKEN}" | podman login \
            --authfile "${HOME}/.docker/config.json" \
            ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
          chmod 600 "${HOME}/.docker/config.json"

      - name: Prepare verified Management Agent
        uses: ./.github/actions/prepare-management
        with:
          signing-key: ${{ secrets.SIGNING_SECRET }}
          mode: both

      - name: Build and validate Development
        uses: ./.github/actions/build-dev

      - name: Push testing development image
        id: push
        shell: bash
        run: |
          set -euo pipefail
          build_tag="testing-$(date -u +%Y%m%d)-${GITHUB_SHA:0:7}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "BUILD_TAG=${build_tag}" >> "${GITHUB_ENV}"

          sudo podman tag justvoxel-dev:build "${IMAGE_REPOSITORY}:${build_tag}"
          sudo podman tag justvoxel-dev:build "${IMAGE_REPOSITORY}:${CURRENT_TAG}"

          sudo podman push \
            --authfile "${HOME}/.docker/config.json" \
            --digestfile /tmp/digest \
            "${IMAGE_REPOSITORY}:${build_tag}"
          sudo podman push \
            --authfile "${HOME}/.docker/config.json" \
            "${IMAGE_REPOSITORY}:${CURRENT_TAG}"

          digest="$(cat /tmp/digest)"
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

      - name: Sign testing development image digest
        shell: bash
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          signing_log="$(mktemp "${RUNNER_TEMP}/cosign-sign.XXXXXX")"
          trap 'rm -f "${signing_log}"' EXIT
          if cosign sign -y \
            --new-bundle-format=false \
            --use-signing-config=false \
            --key env://COSIGN_PRIVATE_KEY \
            "${IMAGE_REPOSITORY}@${DIGEST}" >"${signing_log}" 2>&1; then
            cat "${signing_log}"
          else
            signing_status=$?
            cat "${signing_log}"
            if grep -Fq '[409]' "${signing_log}" && \
               grep -Fq 'an equivalent entry already exists in the transparency log' "${signing_log}"; then
              echo 'Rekor reports an equivalent entry already exists (409); verifying the exact pushed digest.'
              cosign verify \
                --new-bundle-format=false \
                --key cosign.pub \
                "${IMAGE_REPOSITORY}@${DIGEST}"
              echo "Existing signature for the exact digest ${IMAGE_REPOSITORY}@${DIGEST} was verified."
            else
              exit "${signing_status}"
            fi
          fi

      - name: Verify testing development signature
        shell: bash
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          cosign verify \
            --new-bundle-format=false \
            --key cosign.pub \
            "${IMAGE_REPOSITORY}@${DIGEST}"

  cleanup:
    name: cleanup
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      packages: write

    steps:
      - name: Remove expired testing development images
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          packages: justvoxel-dev
          delete-tags: 'testing-*'
          exclude-tags: 'testing,stable,stable-*'
          older-than: 45 days
          keep-n-tagged: 7
          validate: true
