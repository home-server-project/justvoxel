---
name: JustVoxel testing

on:
  push:
    branches: [testing]
    paths-ignore:
      - '**/README.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-testing
  cancel-in-progress: true

env:
  VM_IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/justvoxel-vm
  HWS_IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/justvoxel-hws
  CURRENT_TAG: testing
  JUSTVOXEL_BASE_IMAGE: ghcr.io/home-server-project/justvoxel-base:testing
  RECHUNK_MAX_LAYERS: '127'
  OCI_LAYER_LIMIT: '128'

jobs:
  source-tests:
    name: Product source checks
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout testing branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: testing

      - name: Validate product build scripts
        shell: bash
        run: |
          set -euo pipefail
          for script in build_files/*.sh build_files/validate/*.sh; do
            [[ -f "${script}" ]] || continue
            bash -n "${script}"
          done

  build:
    name: Build JustVoxel VM + HWS testing
    needs: [source-tests]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout testing branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: testing

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y podman skopeo jq

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.2'

      - name: Verify JustVoxel Base testing signature
        shell: bash
        run: |
          set -euo pipefail
          cosign verify \
            --new-bundle-format=false \
            --key cosign.pub \
            "${JUSTVOXEL_BASE_IMAGE}" >/dev/null

      - name: Build JustVoxel VM
        shell: bash
        run: |
          set -euo pipefail
          sudo podman build \
            --pull=always \
            --security-opt=label=disable \
            --build-arg "JUSTVOXEL_BASE_IMAGE=${JUSTVOXEL_BASE_IMAGE}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --target justvoxel-vm \
            --tag justvoxel-vm:test \
            --file Containerfile \
            .

      - name: Build JustVoxel HWS
        shell: bash
        run: |
          set -euo pipefail
          sudo podman build \
            --pull=always \
            --security-opt=label=disable \
            --cap-add=all \
            --device /dev/fuse \
            --build-arg "JUSTVOXEL_BASE_IMAGE=${JUSTVOXEL_BASE_IMAGE}" \
            --build-arg "JUSTVOXEL_BASE_REPOSITORY=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/justvoxel-base" \
            --build-arg "JUSTVOXEL_HWS_REPOSITORY=${HWS_IMAGE_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --target justvoxel-hws \
            --tag justvoxel-hws:unrechunked \
            --file Containerfile \
            .

      - name: Rechunk JustVoxel HWS
        id: rechunk
        shell: bash
        run: |
          set -euo pipefail
          rechunk_tmp="${RUNNER_TEMP}/justvoxel-hws-rechunk"
          sudo mkdir -p "${rechunk_tmp}"
          sudo chmod 1777 "${rechunk_tmp}"
          sudo podman run --rm --privileged \
            -v /var/lib/containers:/var/lib/containers \
            -v "${rechunk_tmp}:/var/tmp" \
            --entrypoint /usr/libexec/bootc-base-imagectl \
            localhost/justvoxel-hws:unrechunked \
            rechunk \
            --max-layers "${RECHUNK_MAX_LAYERS}" \
            localhost/justvoxel-hws:unrechunked \
            localhost/justvoxel-hws:test
          layer_count="$(sudo skopeo inspect --raw containers-storage:localhost/justvoxel-hws:test | jq -r '.layers | length')"
          [[ "${layer_count}" =~ ^[0-9]+$ ]]
          (( layer_count <= OCI_LAYER_LIMIT ))
          echo "layers=${layer_count}" >> "${GITHUB_OUTPUT}"

      - name: Login to GHCR
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.docker"
          printf '%s' "${GHCR_TOKEN}" | podman login \
            --authfile "${HOME}/.docker/config.json" \
            ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
          chmod 600 "${HOME}/.docker/config.json"

      - name: Push VM testing image
        id: push-vm
        shell: bash
        run: |
          set -euo pipefail
          build_tag="testing-$(date -u +%Y%m%d)-${GITHUB_SHA:0:7}"
          echo "VM_BUILD_TAG=${build_tag}" >> "${GITHUB_ENV}"

          sudo podman tag justvoxel-vm:test "${VM_IMAGE_REPOSITORY}:${build_tag}"
          sudo podman tag justvoxel-vm:test "${VM_IMAGE_REPOSITORY}:${CURRENT_TAG}"

          sudo podman push \
            --authfile "${HOME}/.docker/config.json" \
            --digestfile /tmp/vm-digest \
            "${VM_IMAGE_REPOSITORY}:${build_tag}"
          sudo podman push \
            --authfile "${HOME}/.docker/config.json" \
            "${VM_IMAGE_REPOSITORY}:${CURRENT_TAG}"

          digest="$(cat /tmp/vm-digest)"
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

      - name: Push HWS testing image
        id: push-hws
        shell: bash
        run: |
          set -euo pipefail
          build_tag="testing-$(date -u +%Y%m%d)-${GITHUB_SHA:0:7}"
          echo "HWS_BUILD_TAG=${build_tag}" >> "${GITHUB_ENV}"

          sudo podman tag justvoxel-hws:test "${HWS_IMAGE_REPOSITORY}:${build_tag}"
          sudo podman tag justvoxel-hws:test "${HWS_IMAGE_REPOSITORY}:${CURRENT_TAG}"

          sudo podman push \
            --authfile "${HOME}/.docker/config.json" \
            --digestfile /tmp/hws-digest \
            "${HWS_IMAGE_REPOSITORY}:${build_tag}"
          sudo podman push \
            --authfile "${HOME}/.docker/config.json" \
            "${HWS_IMAGE_REPOSITORY}:${CURRENT_TAG}"

          digest="$(cat /tmp/hws-digest)"
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

      - name: Sign VM testing image
        shell: bash
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          DIGEST: ${{ steps.push-vm.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign -y \
            --new-bundle-format=false \
            --use-signing-config=false \
            --key env://COSIGN_PRIVATE_KEY \
            "${VM_IMAGE_REPOSITORY}@${DIGEST}"

      - name: Sign HWS testing image
        shell: bash
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          DIGEST: ${{ steps.push-hws.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign -y \
            --new-bundle-format=false \
            --use-signing-config=false \
            --key env://COSIGN_PRIVATE_KEY \
            "${HWS_IMAGE_REPOSITORY}@${DIGEST}"

      - name: Verify HWS testing signature
        shell: bash
        env:
          DIGEST: ${{ steps.push-hws.outputs.digest }}
        run: |
          set -euo pipefail
          cosign verify \
            --new-bundle-format=false \
            --key cosign.pub \
            "${HWS_IMAGE_REPOSITORY}@${DIGEST}"

      - name: Build summary
        if: always()
        shell: bash
        env:
          HWS_LAYERS: ${{ steps.rechunk.outputs.layers }}
          VM_DIGEST: ${{ steps.push-vm.outputs.digest }}
          HWS_DIGEST: ${{ steps.push-hws.outputs.digest }}
        run: |
          {
            echo "## JustVoxel testing"
            echo
            echo "- Base input: ${JUSTVOXEL_BASE_IMAGE}"
            echo "- VM: ${VM_IMAGE_REPOSITORY}:${CURRENT_TAG}"
            echo "- VM immutable tag: ${VM_IMAGE_REPOSITORY}:${VM_BUILD_TAG:-n/a}"
            echo "- VM digest: ${VM_DIGEST:-not-published}"
            echo "- HWS: ${HWS_IMAGE_REPOSITORY}:${CURRENT_TAG}"
            echo "- HWS immutable tag: ${HWS_IMAGE_REPOSITORY}:${HWS_BUILD_TAG:-n/a}"
            echo "- HWS digest: ${HWS_DIGEST:-not-published}"
            echo "- HWS rechunked layers: ${HWS_LAYERS:-unknown} / ${OCI_LAYER_LIMIT}"
          } >> "${GITHUB_STEP_SUMMARY}"

  cleanup:
    name: cleanup
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - name: Remove expired VM testing images
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          packages: justvoxel-vm
          delete-tags: 'testing-*'
          exclude-tags: 'testing,stable,stable-*'
          older-than: 45 days
          keep-n-tagged: 7
          validate: true

      - name: Remove expired HWS testing images
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          packages: justvoxel-hws
          delete-tags: 'testing-*'
          exclude-tags: 'testing,stable,stable-*'
          older-than: 45 days
          keep-n-tagged: 7
          validate: true
