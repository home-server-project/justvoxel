---
name: HWE testing

on:
  push:
    branches: [testing]
    paths-ignore:
      - '**/README.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-testing
  cancel-in-progress: true

env:
  IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/justvoxel-hwe
  CURRENT_TAG: testing
  JUSTVOXEL_BASE_IMAGE: ghcr.io/home-server-project/justvoxel-base:testing
  RECHUNK_MAX_LAYERS: '127'
  OCI_LAYER_LIMIT: '128'

jobs:
  source-tests:
    name: HWE source checks
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout testing branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: testing

      - name: Validate HWE build scripts
        shell: bash
        run: |
          set -euo pipefail
          for script in build_files/*.sh build_files/validate/*.sh; do
            [[ -f "${script}" ]] || continue
            bash -n "${script}"
          done

  build:
    name: Build JustVoxel HWE testing
    needs: [source-tests]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout testing branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: testing

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y podman skopeo jq

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.2'

      - name: Verify JustVoxel Base testing signature
        shell: bash
        run: |
          set -euo pipefail
          cosign verify \
            --new-bundle-format=false \
            --key cosign.pub \
            "${JUSTVOXEL_BASE_IMAGE}" >/dev/null

      - name: Build JustVoxel HWE
        shell: bash
        run: |
          set -euo pipefail
          sudo podman build \
            --pull=always \
            --security-opt=label=disable \
            --cap-add=all \
            --device /dev/fuse \
            --build-arg "JUSTVOXEL_BASE_IMAGE=${JUSTVOXEL_BASE_IMAGE}" \
            --build-arg "JUSTVOXEL_BASE_REPOSITORY=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/justvoxel-base" \
            --build-arg "JUSTVOXEL_HWE_REPOSITORY=${IMAGE_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --target justvoxel-hwe \
            --tag justvoxel-hwe:unrechunked \
            --file Containerfile \
            .

      - name: Rechunk JustVoxel HWE
        id: rechunk
        shell: bash
        run: |
          set -euo pipefail
          rechunk_tmp="${RUNNER_TEMP}/justvoxel-hwe-rechunk"
          sudo mkdir -p "${rechunk_tmp}"
          sudo chmod 1777 "${rechunk_tmp}"
          sudo podman run --rm --privileged \
            -v /var/lib/containers:/var/lib/containers \
            -v "${rechunk_tmp}:/var/tmp" \
            --entrypoint /usr/libexec/bootc-base-imagectl \
            localhost/justvoxel-hwe:unrechunked \
            rechunk \
            --max-layers "${RECHUNK_MAX_LAYERS}" \
            localhost/justvoxel-hwe:unrechunked \
            localhost/justvoxel-hwe:test
          layer_count="$(sudo skopeo inspect --raw containers-storage:localhost/justvoxel-hwe:test | jq -r '.layers | length')"
          [[ "${layer_count}" =~ ^[0-9]+$ ]]
          (( layer_count <= OCI_LAYER_LIMIT ))
          echo "layers=${layer_count}" >> "${GITHUB_OUTPUT}"

      - name: Validate completed HWE image
        shell: bash
        run: |
          set -euo pipefail
          sudo podman run --rm \
            --entrypoint /bin/bash \
            justvoxel-hwe:test \
            -c '/usr/libexec/justvoxel/health/common && /usr/libexec/justvoxel/health/hwe && bootc container lint --fatal-warnings'

      - name: Login to GHCR
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.docker"
          printf '%s' "${GHCR_TOKEN}" | podman login \
            --authfile "${HOME}/.docker/config.json" \
            ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
          chmod 600 "${HOME}/.docker/config.json"

      - name: Push HWE testing image
        id: push
        shell: bash
        run: |
          set -euo pipefail
          build_tag="testing-$(date -u +%Y%m%d)-${GITHUB_SHA:0:7}"
          echo "BUILD_TAG=${build_tag}" >> "${GITHUB_ENV}"

          sudo podman tag justvoxel-hwe:test "${IMAGE_REPOSITORY}:${build_tag}"
          sudo podman tag justvoxel-hwe:test "${IMAGE_REPOSITORY}:${CURRENT_TAG}"

          sudo podman push \
            --authfile "${HOME}/.docker/config.json" \
            --digestfile /tmp/digest \
            "${IMAGE_REPOSITORY}:${build_tag}"
          sudo podman push \
            --authfile "${HOME}/.docker/config.json" \
            "${IMAGE_REPOSITORY}:${CURRENT_TAG}"

          digest="$(cat /tmp/digest)"
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

      - name: Sign HWE testing image
        shell: bash
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign -y \
            --new-bundle-format=false \
            --use-signing-config=false \
            --key env://COSIGN_PRIVATE_KEY \
            "${IMAGE_REPOSITORY}@${DIGEST}"

      - name: Verify HWE testing signature
        shell: bash
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          cosign verify \
            --new-bundle-format=false \
            --key cosign.pub \
            "${IMAGE_REPOSITORY}@${DIGEST}"

      - name: Build summary
        if: always()
        shell: bash
        env:
          LAYERS: ${{ steps.rechunk.outputs.layers }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "## JustVoxel HWE testing"
            echo
            echo "- Base input: ${JUSTVOXEL_BASE_IMAGE}"
            echo "- HWE package delta: 24 declared packages"
            echo "- Rechunked layers: ${LAYERS:-unknown} / ${OCI_LAYER_LIMIT}"
            echo "- Moving tag: ${IMAGE_REPOSITORY}:${CURRENT_TAG}"
            echo "- Immutable tag: ${IMAGE_REPOSITORY}:${BUILD_TAG:-n/a}"
            echo "- Digest: ${DIGEST:-not-published}"
          } >> "${GITHUB_STEP_SUMMARY}"

  cleanup:
    name: cleanup
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - name: Remove expired HWE testing images
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          packages: justvoxel-hwe
          delete-tags: 'testing-*'
          exclude-tags: 'testing,stable,stable-*'
          older-than: 45 days
          keep-n-tagged: 7
          validate: true
