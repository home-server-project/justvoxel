name: A4.4.1 setup planner check

on:
  push:
    branches: [a441-setup-plan-helper-work]

permissions:
  contents: read

jobs:
  source-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Diagnose setup planner syntax
        shell: bash
        run: |
          set -u
          if ! bash -n mjust/libexec/admin-setup-plan-json; then
            echo '--- shellcheck ---'
            if command -v shellcheck >/dev/null 2>&1; then
              shellcheck -s bash -x mjust/libexec/admin-setup-plan-json || true
            fi
            echo '--- lines containing single quotes ---'
            python3 - <<'PY'
          from pathlib import Path
          p = Path('mjust/libexec/admin-setup-plan-json')
          for n, line in enumerate(p.read_text().splitlines(), 1):
              count = line.count("'")
              if count:
                  print(f"{n:4d} [{count}] {line}")
          PY
            exit 1
          fi
      - name: Validate shell syntax
        shell: bash
        run: |
          set -euo pipefail
          for script in \
            build_files/*.sh \
            build_files/validate/*.sh \
            mjust/bin/mjust \
            mjust/libexec/* \
            runtime/* \
            tests/*.sh; do
            [[ -f "${script}" ]] || continue
            bash -n "${script}"
          done
      - name: Run source regression tests
        shell: bash
        run: |
          set -euo pipefail
          for test_script in tests/test-*.sh; do
            [[ -f "${test_script}" ]] || continue
            bash "${test_script}"
          done
