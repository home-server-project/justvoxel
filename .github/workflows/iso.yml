name: ISO

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  INSTALLER_IMAGE: localhost/justvoxel-installer:local
  IMAGE_BUILDER_IMAGE: ghcr.io/osbuild/image-builder:latest
  ISO_BASENAME: JustVoxel-x86_64

jobs:
  build-installer:
    name: Build JustVoxel online ISO
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash

    steps:
      - name: Require manual dispatch from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::The ISO workflow must be dispatched from main."
          exit 1

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.3'

      - name: Verify both stable product images
        run: |
          set -euo pipefail
          for edition in vm hws; do
            image="ghcr.io/home-server-project/justvoxel-${edition}:stable"
            cosign verify --new-bundle-format=false --key cosign.pub "${image}"
          done

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@cc0becac701cf642c8f0a6613bbdaf5dc36b259e # v9
        with:
          remove-codeql: true

      - name: Build local installer environment
        run: |
          set -euo pipefail
          sudo podman build \
            --pull=always \
            --file installer/Containerfile \
            --tag "${INSTALLER_IMAGE}" \
            .

      - name: Pull image-builder
        run: |
          set -euo pipefail
          sudo podman pull "${IMAGE_BUILDER_IMAGE}"

      - name: Prepare clean output directory
        run: |
          set -euo pipefail
          sudo rm -rf "${GITHUB_WORKSPACE}/output"
          mkdir -p "${GITHUB_WORKSPACE}/output"

      - name: Build online bootc-generic-iso
        run: |
          set -euo pipefail
          sudo podman run --rm \
            --privileged \
            --security-opt label=type:unconfined_t \
            --volume /var/lib/containers/storage:/var/lib/containers/storage \
            --volume "${GITHUB_WORKSPACE}/output:/output" \
            "${IMAGE_BUILDER_IMAGE}" build \
            --bootc-ref "${INSTALLER_IMAGE}" \
            --bootc-default-fs ext4 \
            --output-dir /output \
            --output-name "${ISO_BASENAME}" \
            bootc-generic-iso

      - name: Verify ISO and generate checksum
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}/output"
          if [[ ! -f "${ISO_BASENAME}.iso" ]]; then
            echo "ERROR: Expected ISO output/${ISO_BASENAME}.iso was not produced." >&2
            exit 1
          fi
          sha256sum "${ISO_BASENAME}.iso" > "${ISO_BASENAME}.iso.sha256"

      - name: Upload ISO and checksum
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.ISO_BASENAME }}
          path: |
            output/${{ env.ISO_BASENAME }}.iso
            output/${{ env.ISO_BASENAME }}.iso.sha256
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
