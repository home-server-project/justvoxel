name: Testing
on: workflow_dispatch
concurrency:
  group: product-testing
  cancel-in-progress: false

env:
  VM_IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/justvoxel-vm
  HWS_IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/justvoxel-hws
  CURRENT_TAG: testing
  MANAGEMENT_PACKAGE: ghcr.io/home-server-project/justvoxel-management-agent:testing
  HOME_SERVER_BASE_IMAGE: ghcr.io/home-server-project/home-server-base-10:stable
  PRODUCT_STATUS: development
  RECHUNK_MAX_LAYERS: '127'
  OCI_LAYER_LIMIT: '128'

jobs:
  source-tests:
    if: github.ref == 'refs/heads/testing'
    name: Product source checks
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate product build scripts
        shell: bash
        run: |
          set -euo pipefail
          for script in build_files/*.sh build_files/validate/*.sh; do
            [[ -f "${script}" ]] || continue
            bash -n "${script}"
          done

  build:
    concurrency: management-package-testing
    needs: source-tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go for local WebUI build
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: ".go-version"
          cache: false

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y podman skopeo jq

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.3'

      - name: Login to GHCR
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.docker"
          printf '%s' "${GHCR_TOKEN}" | podman login \
            --authfile "${HOME}/.docker/config.json" \
            ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
          chmod 600 "${HOME}/.docker/config.json"

      - name: Prepare verified Management Agent
        uses: ./.github/actions/prepare-management
        with:
          signing-key: ${{ secrets.SIGNING_SECRET }}

      - name: Build both product images
        uses: ./.github/actions/build-products

      - name: Publish both products
        uses: ./.github/actions/publish-products
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}

  cleanup:
    name: cleanup
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - name: Remove expired VM testing images
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          packages: justvoxel-vm
          delete-tags: 'testing-*'
          exclude-tags: 'testing,stable,stable-*'
          older-than: 45 days
          keep-n-tagged: 7
          validate: true

      - name: Remove expired HWS testing images
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          packages: justvoxel-hws
          delete-tags: 'testing-*'
          exclude-tags: 'testing,stable,stable-*'
          older-than: 45 days
          keep-n-tagged: 7
          validate: true
