name: Build JustVoxel VM and HWS
description: Build JustVoxel VM and HWS
runs:
  using: composite
  steps:
    - name: Build local WebUI artifact
      id: webui
      shell: bash
      run: |
        set -euo pipefail
        ./build_files/build-webui.sh "${GITHUB_SHA}" "${GITHUB_WORKSPACE}/build_artifacts/webui"
        version="$(jq -r '.version' build_artifacts/webui/webui-release.json)"
        source_commit="$(jq -r '.source_commit' build_artifacts/webui/webui-release.json)"
        management_api="$(jq -r '.management_api' build_artifacts/webui/webui-release.json)"
        [[ -n "${version}" && "${version}" != "null" ]]
        [[ "${source_commit}" == "${GITHUB_SHA}" ]]
        [[ "${management_api}" == "v1" ]]
        echo "version=${version}" >> "${GITHUB_OUTPUT}"

    - name: Build JustVoxel VM
      shell: bash
      run: |
        set -euo pipefail
        sudo podman build \
          --layers \
          --pull=missing \
          --security-opt=label=disable \
          --cap-add=all \
          --device /dev/fuse \
          --build-arg "HOME_SERVER_BASE_IMAGE=${HOME_SERVER_BASE_IMAGE}" \
          --build-arg "JUSTVOXEL_VM_REPOSITORY=${VM_IMAGE_REPOSITORY}" \
          --build-arg "PRODUCT_STATUS=${PRODUCT_STATUS}" \
          --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
          --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
          --label "io.home-server-project.justvoxel.webui.version=${{ steps.webui.outputs.version }}" \
          --label "io.home-server-project.justvoxel.management-api=v1" \
          --target justvoxel-vm \
          --tag justvoxel-vm:unrechunked \
          --file Containerfile \
          .

    - name: Build JustVoxel HWS
      shell: bash
      run: |
        set -euo pipefail
        sudo podman build \
          --layers \
          --pull=missing \
          --security-opt=label=disable \
          --cap-add=all \
          --device /dev/fuse \
          --build-arg "HOME_SERVER_BASE_IMAGE=${HOME_SERVER_BASE_IMAGE}" \
          --build-arg "JUSTVOXEL_HWS_REPOSITORY=${HWS_IMAGE_REPOSITORY}" \
          --build-arg "JUSTVOXEL_VM_REPOSITORY=${VM_IMAGE_REPOSITORY}" \
          --build-arg "PRODUCT_STATUS=${PRODUCT_STATUS}" \
          --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
          --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
          --label "io.home-server-project.justvoxel.webui.version=${{ steps.webui.outputs.version }}" \
          --label "io.home-server-project.justvoxel.management-api=v1" \
          --target justvoxel-hws \
          --tag justvoxel-hws:unrechunked \
          --file Containerfile \
          .

    - name: Rechunk products and check their layer counts
      shell: bash
      run: |
        set -euo pipefail
        for edition in vm hws; do
          rechunk_tmp="${RUNNER_TEMP}/justvoxel-${edition}-rechunk"
          sudo mkdir -p "${rechunk_tmp}"
          sudo chmod 1777 "${rechunk_tmp}"
          sudo podman run --rm --privileged \
            -v /var/lib/containers:/var/lib/containers \
            -v "${rechunk_tmp}:/var/tmp" \
            --entrypoint /usr/libexec/bootc-base-imagectl \
            localhost/justvoxel-${edition}:unrechunked \
            rechunk \
            --max-layers "${RECHUNK_MAX_LAYERS}" \
            localhost/justvoxel-${edition}:unrechunked \
            localhost/justvoxel-${edition}:test
          layer_count="$(sudo skopeo inspect --raw containers-storage:localhost/justvoxel-${edition}:test | jq -r '.layers | length')"
          [[ "${layer_count}" =~ ^[0-9]+$ ]]
          (( layer_count <= OCI_LAYER_LIMIT ))
          sudo podman run --rm -i --entrypoint /bin/bash "localhost/justvoxel-${edition}:test" \
            < build_files/validate/completed-image.sh
        done
