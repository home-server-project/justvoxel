name: Build JustVoxel VM and HWS
description: Build JustVoxel VM and HWS
runs:
  using: composite
  steps:
    - name: Build JustVoxel VM
      shell: bash
      run: |
        set -euo pipefail
        sudo podman build \
          --pull=never \
          --security-opt=label=disable \
          --build-arg "JUSTVOXEL_DEV_IMAGE=${JUSTVOXEL_DEV_IMAGE}" \
          --build-arg "PARENT_CHANNEL=${PARENT_CHANNEL}" \
          --build-arg "PRODUCT_STATUS=${PRODUCT_STATUS}" \
          --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
          --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
          --target justvoxel-vm \
          --tag justvoxel-vm:test \
          --file Containerfile \
          .

    - name: Build JustVoxel HWS
      shell: bash
      run: |
        set -euo pipefail
        sudo podman build \
          --pull=never \
          --security-opt=label=disable \
          --cap-add=all \
          --device /dev/fuse \
          --build-arg "JUSTVOXEL_DEV_IMAGE=${JUSTVOXEL_DEV_IMAGE}" \
          --build-arg "JUSTVOXEL_DEV_REPOSITORY=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/justvoxel-dev" \
          --build-arg "JUSTVOXEL_HWS_REPOSITORY=${HWS_IMAGE_REPOSITORY}" \
          --build-arg "PARENT_CHANNEL=${PARENT_CHANNEL}" \
          --build-arg "PRODUCT_STATUS=${PRODUCT_STATUS}" \
          --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
          --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
          --target justvoxel-hws \
          --tag justvoxel-hws:unrechunked \
          --file Containerfile \
          .

    - name: Rechunk JustVoxel HWS
      id: rechunk
      shell: bash
      run: |
        set -euo pipefail
        rechunk_tmp="${RUNNER_TEMP}/justvoxel-hws-rechunk"
        sudo mkdir -p "${rechunk_tmp}"
        sudo chmod 1777 "${rechunk_tmp}"
        sudo podman run --rm --privileged \
          -v /var/lib/containers:/var/lib/containers \
          -v "${rechunk_tmp}:/var/tmp" \
          --entrypoint /usr/libexec/bootc-base-imagectl \
          localhost/justvoxel-hws:unrechunked \
          rechunk \
          --max-layers "${RECHUNK_MAX_LAYERS}" \
          localhost/justvoxel-hws:unrechunked \
          localhost/justvoxel-hws:test
        layer_count="$(sudo skopeo inspect --raw containers-storage:localhost/justvoxel-hws:test | jq -r '.layers | length')"
        [[ "${layer_count}" =~ ^[0-9]+$ ]]
        (( layer_count <= OCI_LAYER_LIMIT ))
        echo "layers=${layer_count}" >> "${GITHUB_OUTPUT}"
