# gssproxy package state under /var must be recreated on every bootc deployment.
# /var is persistent across bootc upgrades, so package-owned directories baked
# into an image are not a reliable upgrade mechanism.
d /var/lib/gssproxy         0755 root root -
d /var/lib/gssproxy/clients 0700 root root -
d /var/lib/gssproxy/rcache  0700 root root -
z /var/lib/gssproxy         0755 root root -
z /var/lib/gssproxy/clients 0700 root root -
z /var/lib/gssproxy/rcache  0700 root root -
